<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЦОП Помощник</title>
  <style>
    :root {
      --bg: #161622;
      --surface: #222236;
      --surface-2: #2c2c44;
      --text: #f2f2f7;
      --muted: #a9a9bd;
      --accent: #ffc400;
      --danger: #ff4a2a;
      --line: #3a3a55;
    }
    * { box-sizing: border-box; }
    body {
      width: 480px;
      max-height: 660px;
      overflow-y: auto;
      margin: 0;
      padding: 16px;
      background: linear-gradient(160deg, #1b1b2b, var(--bg));
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body::-webkit-scrollbar { width: 8px; }
    body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 38px; height: 38px; border-radius: 9px; }
    h1 { font-size: 17px; margin: 0; }
    h1 small { display: block; font-size: 11px; font-weight: normal; color: var(--muted); margin-top: 2px; }

    .row { display: flex; gap: 7px; }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 9px 10px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--text); font-size: 14px;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      padding: 9px 12px; border: none; border-radius: 8px;
      background: var(--surface-2); color: var(--text);
      font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    button:hover { filter: brightness(1.18); }
    button.primary { background: var(--accent); color: #1e1e2e; font-weight: 700; }
    button.danger { background: var(--danger); color: #fff; font-weight: 700; }

    .block {
      margin-top: 12px; padding: 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    }
    .block h2 { font-size: 13px; margin: 0 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
    #result h3 { font-size: 15px; margin: 10px 0 5px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .step {
      margin: 9px 0; padding: 9px 10px;
      background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    }
    .step-title { font-weight: 700; }
    .step-instr { margin: 4px 0 7px; font-size: 13px; }
    .chip {
      display: inline-block; padding: 2px 7px; margin-right: 5px;
      background: #3a3a55; border-radius: 10px; font-size: 11px; color: var(--muted);
    }
    #status { margin-top: 9px; font-size: 12px; color: var(--accent); }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    details .route { display: block; width: 100%; text-align: left; margin: 4px 0; }
    .log-entry { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    footer { margin-top: 14px; text-align: center; font-size: 11px; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="">
    <h1>ЦОП Помощник<small>Поиск маршрутов и подсветка слов на странице</small></h1>
  </header>

  <div class="block">
    <h2>Вопрос</h2>
    <div class="row">
      <input id="query" type="text" placeholder="Например: как уйти в ПФДО?">
      <button id="searchBtn" class="primary">Найти</button>
    </div>
    <div id="result"></div>
  </div>

  <div class="block">
    <h2>Подсветка на странице</h2>
    <div class="row">
      <input id="word" type="text" placeholder="Слово: ПФДО, Перейти…">
      <button id="wordBtn" class="danger">Подсветить</button>
    </div>
    <div id="status">Введите слово и нажмите «Подсветить».</div>
  </div>

  <details>
    <summary>Контрольные маршруты</summary>
    <div id="routes"></div>
  </details>

  <details>
    <summary>Журнал ответов</summary>
    <div id="log"></div>
    <button id="clearLog" style="margin-top:8px;">Очистить журнал</button>
  </details>

  <footer><a href="https://cop.admhmao.ru/elk" id="openCop">Открыть сайт ЦОП ↗</a></footer>

  <script src="data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
