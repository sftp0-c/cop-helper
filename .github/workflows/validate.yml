name: Validate extension
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  syntax-and-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check data.js
      - run: node --check popup.js
      - run: node --check content.js
      - run: node tests/search.test.cjs
